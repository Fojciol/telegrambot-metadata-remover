services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-metadata-remover:latest
    container_name: telegram-metadata-remover
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
      - TEMP_DIR=${TEMP_DIR:-/tmp/bot_media}
